<!DOCTYPE html>
<html>
<head>
  <title>Cloud App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      width: 400px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #333;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #667eea;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5a67d8;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      background: #f3f4f6;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Add Name</h2>

  <div class="input-group">
    <input type="text" id="nameInput" placeholder="Enter name">
    <button onclick="addName()">Add</button>
  </div>

  <ul id="list"></ul>
</div>

<script>

async function loadData() {
  const res = await fetch("/test-db");
  const data = await res.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(item => {
    const li = document.createElement("li");
    li.textContent = item.name;
    list.appendChild(li);
  });
}

async function addName() {
  const name = document.getElementById("nameInput").value;

  if (!name) return alert("Please enter a name");

  await fetch("/add-name", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name })
  });

  document.getElementById("nameInput").value = "";
  loadData();
}

loadData();

</script>

</body>
</html>
